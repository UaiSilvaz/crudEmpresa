<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Adms</title>
</head>

<body style="
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(270deg, #6a0dad, #9b30ff, #4b0082, #8a2be2);
    background-size: 800% 800%;
    animation: gradientBG 20s ease infinite;
    color: #e0d7f5;
">

    <style>
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background: linear-gradient(135deg, #6a0dad, #9b30ff);
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(155, 48, 255, 0.4);
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #e0d7f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(155, 48, 255, 0.3);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0d7f5;
        }

        th {
            background: linear-gradient(135deg, #9b30ff, #7a1ed9);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
        }

        tr:hover {
            background: rgba(155, 48, 255, 0.2);
            transition: background 0.3s ease;
        }

        .action-link {
            display: inline-block;
            margin: 5px;
            padding: 8px 16px;
            background: #9b30ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .action-link:hover {
            background: #7a1ed9
        }

        .link-nova {
            text-align: center;
            margin-top: 20px;
            display: inline-block;
            color: #d1b3ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 24px;
            background: rgba(155, 48, 255, 0.2);
            border: 2px solid #9b30ff;
            border-radius: 8px;
        }

        .link-nova:hover {
            color: #fff;
            background: #9b30ff
        }
    </style>

    <div class="container">
        <h2>Lista de Administradores</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Login</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="adm : ${adms}">
                    <td th:text="${adm.id_adm}"></td>
                    <td th:text="${adm.nome}"></td>
                    <td th:text="${adm.email}"></td>
                    <td th:text="${adm.login}"></td>
                    <td th:text="${adm.telefone}"></td>
                    <td>
                        <a th:href="@{/admCTR/editarAdm/{id}(id=${adm.id_adm})}" class="action-link">Editar</a>
                        <a th:href="@{/admCTR/deletarAdm/{id}(id=${adm.id_adm})}"
                            onclick="return confirm('Deseja realmente excluir este administrador?')"
                            class="action-link">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <br>
        <a th:href="@{/admCTR/formAdm}" class="link-nova">Novo Administrador</a>
    </div>

</body>

</html>
