<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Adm</title>
</head>

<body
    style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg,#6a0dad,#9b30ff); color:#fff; height:100vh; display:flex; align-items:center; justify-content:center;">
    <div
        style="background:rgba(255,255,255,0.04); padding:30px; border-radius:12px; width:100%; max-width:480px; box-shadow:0 8px 20px rgba(0,0,0,0.3);">
        <h2 style="text-align:center; margin-bottom:18px;">Editar Administrador</h2>

        <form th:action="@{/admCTR/atualizarAdm/{id}(id=${admEditar.id_adm})}" th:object="${admEditar}" method="post">
            <div style="margin-bottom:12px;">
                <label>Nome</label>
                <input type="text" th:field="*{nome}" required
                    style="width:100%; padding:8px; border-radius:6px; border:none;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Email</label>
                <input type="email" th:field="*{email}" required
                    style="width:100%; padding:8px; border-radius:6px; border:none;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Login</label>
                <input type="text" th:field="*{login}" required
                    style="width:100%; padding:8px; border-radius:6px; border:none;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Senha</label>
                <input type="password" th:field="*{senha}"
                    style="width:100%; padding:8px; border-radius:6px; border:none;" />
            </div>
            <div style="margin-bottom:12px;">
                <label>Telefone</label>
                <input type="number" th:field="*{telefone}"
                    style="width:100%; padding:8px; border-radius:6px; border:none;" />
            </div>

            <div style="display:flex; gap:12px; justify-content:space-between;">
                <button type="submit"
                    style="flex:1; padding:10px; border-radius:8px; background:#9b30ff; color:white; border:none; font-weight:700;">Atualizar</button>
                <a th:href="@{/admCTR/listarAdm}"
                    style="flex:1; text-align:center; padding:10px; border-radius:8px; background:rgba(255,255,255,0.06); color:#e0d7f5; text-decoration:none; display:inline-block;">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
