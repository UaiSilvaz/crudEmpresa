<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pagina Principal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(270deg, #6a0dad, #9b30ff, #4b0082, #8a2be2);
            background-size: 800% 800%;
            animation: gradientBG 20s ease infinite;
            color: #e0d7f5;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            background: linear-gradient(135deg, #6a0dad, #9b30ff);
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(155, 48, 255, 0.4);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        /* Novo estilo dos links: estilo de botões elegantes */
        .link-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            text-align: center;
            background: #ffffff;
            color: #6a0dad;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
            user-select: none;
        }

        .link-btn:hover {
            background: #e9d6ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.5);
        }

        .link-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Links para as páginas</h2>

        <a th:href="@{/empresaCTR/viewCadEmpresa}" class="link-btn">Cadastrar Empresa</a>
        <a th:href="@{/funcionarioCTR/formFuncionario}" class="link-btn">Cadastrar Funcionário</a>
        <a th:href="@{/empresaCTR/listarTodasEmpresas}" class="link-btn">Listar Todas as Empresas</a>
        <a th:href="@{/funcionarioCTR/listarFunc}" class="link-btn">Listar Todos os Funcionários</a>
        <a th:href="@{/empresaCTR/formBuscarNome}" class="link-btn">Buscar Empresa por Nome</a>
    </div>
</body>

</html>
